services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY: 1
      COOKIE_SECURE: auto
    volumes:
      - landfill-api:/data
    expose:
      - "3000"
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'node -e "fetch(''http://localhost:3000/api/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  proxy:
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    ports:
      - "${LANDFILL_BIND_ADDRESS:-127.0.0.1}:${LANDFILL_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  landfill-api:
